spring:
  application:
    name: playstock-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  youtube:
    api-key: ${YOUTUBE_API_KEY}
    base-url: https://www.googleapis.com/youtube/v3

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 1024

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24시간

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth/youtube/callback}
    encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY}
    frontend-redirect-url: ${FRONTEND_URL:http://localhost:3000}

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
